version: "3.9"

services:
  everyday_store_backend_app:
    image: shazimali/everyday-store-backend:latest
    container_name: everyday_store_backend_app
    restart: always
    env_file:
      - /var/www/everyday_store/backend/.env # Your manually created .env
    ports:
      - "8082:80"
    networks:
      - global_network
    volumes:
      - everyday_store_backend_storage:/var/www/everyday_store/backend/storage
      - everyday_store_backend_cache:/var/www/everyday_store/backend/bootstrap/cache
      - /var/www/everyday_store/backend/.env:/var/www/everyday_store/backend/.env

networks:
  global_network:
    external: true

volumes:
  everyday_store_backend_storage:
  everyday_store_backend_cache:
