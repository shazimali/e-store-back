name: 🚀 Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'Dockerfile'
      - 'docker/**'

env:
  # ── Stored as GitHub Secrets (Settings → Secrets → Actions) ──────────────
  # DOCKER_IMAGE_NAME  e.g. youruser/your-image-name
  # VPS_APP_PATH       e.g. /var/www/myapp/backend
  # CONTAINER_PORT     e.g. 8082
  # DOCKER_NETWORK     e.g. global_network
  # CONTAINER_APP_NAME e.g. my_backend_app
  IMAGE_NAME:     ${{ secrets.DOCKER_IMAGE_NAME }}
  VPS_APP_PATH:   ${{ secrets.VPS_APP_PATH }}
  CONTAINER_NAME: ${{ secrets.CONTAINER_APP_NAME }}
  CONTAINER_PORT: ${{ secrets.CONTAINER_PORT }}
  DOCKER_NETWORK: ${{ secrets.DOCKER_NETWORK }}

  # ── Volume names are NOT secrets – keep them explicit so existing ─────────
  # ── Docker volumes on the VPS are reused and no data is lost.    ─────────
  STORAGE_VOLUME: ${{ secrets.STORAGE_VOLUME_NAME }}
  CACHE_VOLUME:   ${{ secrets.CACHE_VOLUME_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: 🧱 Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Enable Docker Buildx
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Login Docker Hub
      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 4️⃣ Build & Push (CACHED)
      - name: 🏗️ Build and Push Docker Image (Cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5️⃣ Deploy to VPS (Zero Overhead)
      - name: 🚀 Deploy on VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_NAME,VPS_APP_PATH,CONTAINER_NAME,CONTAINER_PORT,DOCKER_NETWORK,STORAGE_VOLUME,CACHE_VOLUME
          script: |
            set -e
            cd $VPS_APP_PATH

            docker pull $IMAGE_NAME:latest

            docker rm -f $CONTAINER_NAME || true

            docker run -d \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              --env-file .env \
              -v $STORAGE_VOLUME:$VPS_APP_PATH/storage \
              -v $CACHE_VOLUME:$VPS_APP_PATH/bootstrap/cache \
              --network $DOCKER_NETWORK \
              -p $CONTAINER_PORT:80 \
              $IMAGE_NAME:latest

            echo "⏳ Waiting for container to be healthy..."
            for i in $(seq 1 30); do
              if curl -s http://localhost:$CONTAINER_PORT > /dev/null 2>&1; then
                echo "✅ Container is up and responding!"
                exit 0
              fi
              echo "Attempt $i/30 — waiting 5s..."
              sleep 5
            done

            echo "❌ Container did not respond after 150s. Diagnostics:"
            echo "--- docker ps ---"
            docker ps -a | grep $CONTAINER_NAME
            echo "--- container logs ---"
            docker logs --tail=100 $CONTAINER_NAME
            exit 1
