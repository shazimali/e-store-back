name: 🚀 Deploy Everyday Store Backend (Fast)

on:
  push:
    branches: [main]
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'Dockerfile'
      - 'docker/**'

env:
  IMAGE_NAME: shazimali/everyday-store-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: 🧱 Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Enable Docker Buildx
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Login Docker Hub
      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 4️⃣ Build & Push (CACHED)
      - name: 🏗️ Build and Push Docker Image (Cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          pull: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5️⃣ Deploy to VPS (Zero Overhead)
      - name: 🚀 Deploy on VPS
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/everyday_store/backend

            docker pull ${{ env.IMAGE_NAME }}:latest

            docker rm -f everyday_store_backend_app || true

            docker run -d \
              --name everyday_store_backend_app \
              --restart unless-stopped \
              --env-file .env \
              -v everyday_store_backend_storage:/var/www/everyday_store/backend/storage \
              -v everyday_store_backend_cache:/var/www/everyday_store/backend/bootstrap/cache \
              --network global_network \
              -p 8082:80 \
              ${{ env.IMAGE_NAME }}:latest

            echo "⏳ Waiting for container to be healthy..."
            for i in $(seq 1 30); do
              # curl -s (no -f): exits 0 on ANY HTTP response (200, 404, etc.)
              # Only fails on network errors (connection refused = truly down)
              # 404 is expected for GET / on an API-only Laravel app — server IS healthy
              if curl -s http://localhost:8082 > /dev/null 2>&1; then
                echo "✅ Container is up and responding!"
                exit 0
              fi
              echo "Attempt $i/30 — waiting 5s..."
              sleep 5
            done

            echo "❌ Container did not respond after 150s. Diagnostics:"
            echo "--- docker ps ---"
            docker ps -a | grep everyday_store_backend_app
            echo "--- container logs ---"
            docker logs --tail=100 everyday_store_backend_app
            exit 1
