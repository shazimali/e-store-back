# =====================================================================
# Everyday Shop - Apache Virtual Host for API
# =====================================================================

# Default catch-all VirtualHost — handles health checks from localhost
# (curl http://localhost:8082 sends Host: localhost which won't match the
#  named VirtualHost below; without this, Apache returns 403)
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/everyday_store/backend/public
    <Directory /var/www/everyday_store/backend/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/everyday_store/backend/public

    # API domain
    ServerName api.everydaypak.com
    ServerAlias www.api.everydaypak.com

    <Directory /var/www/everyday_store/backend/public>
        AllowOverride All
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/api_everydaypak_error.log
    CustomLog ${APACHE_LOG_DIR}/api_everydaypak_access.log combined
</VirtualHost>
