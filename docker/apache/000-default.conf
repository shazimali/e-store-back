# =====================================================================
# Everyday Shop - Apache Virtual Host for Multiple Domains
# =====================================================================

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/everyday_store/backend/public

    # Primary domain
    ServerName everydaypak.com

    # Additional domains / aliases
    ServerAlias www.api.everydaypak.com \
                 api.everydaypak.com \
                 localhost 127.0.0.1

    <Directory /var/www/everyday_store/backend/public>
        Require ip 72.60.237.179
        AllowOverride All
        Options Indexes FollowSymLinks
        Require all granted
    </Directory>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/everyday_store_backend_error.log
    CustomLog ${APACHE_LOG_DIR}/everyday_store_backend_access.log combined
</VirtualHost>